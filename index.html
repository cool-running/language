<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외국어 복습</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9381e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분한 개인 복습 노트, 매일 10분
   IDEA: 여행 가방 속 단어 카드 묶음 — 한 장씩 말하고, 쓰고, 넘긴다
   PICTURE: 지금 연습 중인 카드 한 장이 화면의 주인공
   COLOUR and TYPE: 일본어=주홍 #d9381e, 영어=파랑 #1d5fd0 / Noto Sans KR + JP
   LAYOUT: 언어색 머리 띠 → 메뉴 목록 → 연습 화면은 한 열 카드 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141210);--ink:light-dark(#1a1714,#f3efe9);--mute:light-dark(#6b645c,#a79f95);--card:light-dark(#f3f0eb,#221f1b);--line:light-dark(#e2ddd5,#38332d);--jp:#d9381e;--en:#1d5fd0;--acc:#ffc93c;--ok:#178a52;--bad:#d23434;--c:var(--jp)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
body.en{--c:var(--en)}
.jpf{font-family:"Noto Sans JP","Noto Sans KR",sans-serif}
header{background:var(--c);color:#fff;padding:16px max(5vw,16px) 20px;transition:background .3s}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:760px;margin:auto}
h1{margin:0;font-size:clamp(26px,6vw,34px);line-height:1.05;font-weight:900}
.seg{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:4px}
.seg button{border:0;background:none;color:#fff;font:700 15px "Noto Sans KR";padding:8px 16px;border-radius:999px;min-height:40px;cursor:pointer}
.seg button.on{background:#fff;color:var(--c)}
.sub{max-width:760px;margin:8px auto 0;font-size:14px;opacity:.92}
main{max-width:760px;margin:auto;padding:16px max(4vw,14px) 48px}
.menu{display:grid;gap:10px}
.mi{display:flex;gap:14px;align-items:center;text-align:left;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:16px;cursor:pointer;font:inherit;width:100%}
.mi i{flex:none;width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:900 24px/1 "Noto Sans JP";font-style:normal}
.mi b{display:block;font-size:18px}
.mi span{display:block;font-size:14px;color:var(--mute);line-height:1.4}
.mi em{margin-left:auto;flex:none;background:var(--acc);color:#1a1714;font:700 13px "Noto Sans KR";font-style:normal;border-radius:99px;padding:3px 10px}
.mi:disabled{opacity:.45}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 13px;font:700 14px "Noto Sans KR";min-height:38px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:14px;padding:11px 16px;font:700 16px "Noto Sans KR";min-height:48px;cursor:pointer;background:var(--c);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.4}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar b{flex:1;font-size:19px}
.bar .prog{flex:1;height:8px;background:var(--card);border-radius:9px;overflow:hidden}
.bar .prog div{height:100%;background:var(--c);transition:width .3s}
.x{border:0;background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.card{background:var(--card);border-radius:22px;padding:22px 18px;margin-bottom:12px;border-bottom:5px solid var(--c);position:relative}
.card .ask{font-size:13px;color:var(--mute);font-weight:700}
.card .big{font-size:clamp(24px,6.5vw,36px);font-weight:800;line-height:1.25;margin:6px 0 2px;word-break:keep-all}
.card .mid{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.4;margin:6px 0 2px;word-break:keep-all}
.card .hint{color:var(--mute);font-size:15px}
.card.center{text-align:center}
.star{position:absolute;top:12px;right:12px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--mute);width:44px;height:44px}
.star.on{color:var(--acc)}
textarea,input[type=text]{width:100%;font:18px/1.45 "Noto Sans KR",sans-serif;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.ans{margin-top:12px;border-radius:16px;padding:14px 16px;background:var(--card)}
.ans .t{font-size:20px;font-weight:700;line-height:1.45;word-break:keep-all}
.ans .k{color:var(--mute);font-size:15px;margin-top:4px}
mark.miss{background:color-mix(in srgb,var(--acc) 55%,transparent);color:inherit;border-radius:4px;padding:0 3px}
s.extra{color:var(--bad)}
.verdict{font-weight:900;margin-bottom:4px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.rate button{border:0;border-radius:14px;min-height:56px;font:800 16px "Noto Sans KR";cursor:pointer;color:#fff}
.rate .r0{background:var(--bad)}.rate .r1{background:#c98a12}.rate .r2{background:var(--ok)}
.rate button small{display:block;font:500 12px "Noto Sans KR";opacity:.9}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list li div{flex:1}
.list li b{display:block;font-size:17px;word-break:keep-all}
.list li small{color:var(--mute);font-size:14px}
.ib{border:0;background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.ib.on{color:var(--acc)}
/* 50음도 */
.goj{display:grid;grid-template-columns:3.2em repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.goj .rh{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);font-weight:700}
.gc{border:0;border-radius:12px;background:var(--card);color:var(--ink);min-height:62px;padding:4px 2px;cursor:pointer;font:800 26px/1.1 "Noto Sans JP","Noto Sans KR"}
.gc small{display:block;font:700 12px "Noto Sans KR";color:var(--mute);margin-top:2px}
.gc.new{opacity:.45}.gc.empty{visibility:hidden}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ovc{background:var(--bg);border-radius:22px;width:min(520px,100%);max-height:94vh;overflow:auto;padding:18px;text-align:center}
.pic{width:100%;max-width:420px;border-radius:14px;display:block;margin:10px auto}
.kbig{font:800 72px/1 "Noto Sans JP";color:var(--c)}
/* 쓰기 */
.pad{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto;border-radius:18px;background:var(--card);touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:18px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>외국어 복습</h1>
    <div class="seg">
      <button id="L-jp" class="on" data-l="jp">일본어</button>
      <button id="L-en" data-l="en">영어</button>
    </div>
  </div>
  <div class="sub" id="sub">노트 불러오는 중…</div>
</header>
<main>
  <section id="home"></section>
  <section id="play" class="hide"></section>
  <p class="note" id="foot">내용은 GitHub notes 폴더의 노트에서 자동으로 만들어져요. 복습 기록과 내 표현은 이 기기에 저장돼요.</p>
</main>
<script>
{
/* ---------- 노트 불러오기 ---------- */
let JP=[],EN=[],ENX=[],KANA=[],JTRAP=[],LOADED=false,LOADERR='';
const clean=t=>t.replace(/\*\*/g,'').replace(/\\([~*_|])/g,'$1').trim();
function tables(md){const out=[];let cur=null;for(const raw of md.split(/\r?\n/)){const l=raw.trim();if(l.startsWith('|')){const cells=l.replace(/^\||\|$/g,'').split('|').map(clean);if(cells.every(c=>/^:?-{3,}:?$/.test(c)))continue;if(!cur){cur={head:cells,rows:[]};out.push(cur)}else cur.rows.push(cells)}else cur=null}return out}
function parseJP(md,s){for(const t of tables(md)){const h=t.head.join('|');
  if(t.head[0]==='행'){for(const r of t.rows)for(const c of r.slice(1)){const m=c.match(/^(\S+)\s+(.+)$/);if(m&&!KANA.some(k=>k.k===m[1]))KANA.push({k:m[1],p:m[2]})}}
  else if(h.includes('헷갈린')){for(const r of t.rows)if(r[0]&&r[1]&&r[2])JTRAP.push({k:r[0],p:r[1],t:r[2],h:r[3]||''})}
  else if(h.includes('히라가나')&&h.includes('뜻')){for(const r of t.rows)if(r[0]&&!JP.some(x=>x.k===r[0]))JP.push(r.length>=3?{k:r[0],p:r[1],m:r[r.length-1],s}:{k:r[0],p:'',m:r[1],s})}}}
function parseEN(md,s){for(const t of tables(md)){const h=t.head;
  if(h[0]&&h[0].includes('자주 한 실수')){for(const r of t.rows){if(!r[1]||(r[2]||'').includes('졸업'))continue;const ctx=(r[0].match(/\(([^)]*)\)\s*$/)||[])[1]||'';const w=r[0].replace(/\s*\([^)]*\)\s*$/,'').split(' / '),ri=r[1].split(' / ');const pairs=w.length===ri.length?w.map((x,i)=>[x,ri[i]]):[[w.join(' / '),r[1]]];for(const [x,y] of pairs)if(x!==y&&!ENX.some(z=>z.r===y))ENX.push({w:x,r:y,m:r[2]||'',k:ctx})}continue}
  const ei=h.findIndex(c=>c.includes('표현')),mi=h.findIndex(c=>c==='뜻'),si=h.findIndex(c=>c==='상황');if(ei<0||mi<0)continue;
  for(const r of t.rows)if(r[ei]&&r[mi]&&/[A-Za-z]/.test(r[ei])&&!EN.some(x=>x.e===r[ei]))EN.push({e:r[ei],m:r[mi],s,sit:si>=0?r[si]:''})}}
async function loadNotes(){
  try{const ix=await (await fetch('notes/index.json',{cache:'no-cache'})).json();
    for(const lang of Object.keys(ix))for(const f of ix[lang]){const r=await fetch('notes/'+f.file.split('/').map(encodeURIComponent).join('/'),{cache:'no-cache'});if(r.ok)(lang==='일본어'?parseJP:parseEN)(await r.text(),f.label)}
    LOADED=true}catch(e){LOADERR='노트를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'}
  home()}

/* ---------- 저장 ---------- */
const KEY='langReview1';
let S={lang:'jp',srs:{},star:{},mine:[],auto:true,kanaRow:'learned'};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5,now=()=>Date.now();

/* 간격 반복: 다시=곧, 헷갈려요=내일, 알아요=점점 길게 */
const GAPS=[1,2,4,7,15,30];
function rate(id,r){const c=S.srs[id]||{b:0,d:0};if(r===0){c.b=0;c.d=now()+5*60e3}else if(r===1){c.b=Math.max(0,c.b-1);c.d=now()+DAY}else{c.d=now()+GAPS[Math.min(c.b,GAPS.length-1)]*DAY;c.b++}c.w=r<2?(c.w||0)+1:c.w||0;S.srs[id]=c;save()}
const isDue=id=>{const c=S.srs[id];return !!c&&c.d<=now()};
const isNew=id=>!S.srs[id];
function deck(items,idf,n){const due=items.filter(x=>isDue(idf(x))).sort((a,b)=>S.srs[idf(a)].d-S.srs[idf(b)].d);const nw=items.filter(x=>isNew(idf(x)));return due.concat(nw).slice(0,n)}

/* ---------- 소리 ---------- */
const tts='speechSynthesis' in window;
function say(t,lang,rate){if(!tts||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g,'').replace(/^\.\.\./,''));u.lang=lang==='jp'?'ja-JP':'en-US';u.rate=rate||.9;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(u.lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb,fail){try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>fail(e.error);r.start();return r}catch(e){fail('x')}}

/* ---------- 영어 비교 ---------- */
const tok=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9'\s-]/g,' ').split(/\s+/).filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const ka=new Set,kb=new Set;let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){ka.add(i);kb.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return [ka,kb]}
function compare(target,said){
  const alts=target.replace(/\([^)]*\)/g,'').replace(/^\.\.\./,'').split(' / ').map(x=>x.trim()).filter(Boolean);
  const u=tok(said);let best=null;
  for(const alt of alts){const words=alt.split(/\s+/),tw=words.map(w=>tok(w)[0]||'');const [kt,ku]=lcs(tw,u);const miss=tw.filter((w,i)=>w&&!kt.has(i)).length,extra=u.filter((w,i)=>!ku.has(i));const sc=miss+extra.length;if(!best||sc<best.sc)best={sc,miss,extra,html:words.map((w,i)=>tw[i]&&!kt.has(i)?`<mark class="miss">${esc(w)}</mark>`:esc(w)).join(' ')}}
  return best}
function verdictHTML(b){if(!b)return '';if(b.sc===0)return '<div class="verdict ok-t">완벽해요!</div>';return `<div class="verdict bad-t">${b.miss?`빠진 단어 ${b.miss}개`:''}${b.miss&&b.extra.length?' · ':''}${b.extra.length?`다르게 쓴 단어: <s class="extra">${b.extra.map(esc).join(' ')}</s>`:''}</div>`}

/* ---------- 50음도 ---------- */
const GOJ=[['あ','あいうえお','아 이 우 에 오'],['か','かきくけこ','카 키 쿠 케 코'],['さ','さしすせそ','사 시 스 세 소'],['た','たちつてと','타 치 츠 테 토'],['な','なにぬねの','나 니 누 네 노'],['は','はひふへほ','하 히 후 헤 호'],['ま','まみむめも','마 미 무 메 모'],['や','や_ゆ_よ','야 _ 유 _ 요'],['ら','らりるれろ','라 리 루 레 로'],['わ','わ___を','와 _ _ _ 오'],['ん','ん____','응 _ _ _ _']].map(([h,ks,rs])=>({h,cells:Array.from(ks).map((k,i)=>k==='_'?null:{k,p:rs.split(' ')[i]})}));
const GLIST=GOJ.flatMap(r=>r.cells.filter(Boolean));
const imgOf=k=>{const c=GLIST.find(x=>x.k===k);return c?'img/kana/'+encodeURIComponent(k==='を'?'오(2)':c.p)+'.webp':''};
const learnedKana=()=>{const s=new Set(KANA.map(x=>x.k));return GLIST.filter(c=>s.has(c.k))};

/* ---------- 메뉴 ---------- */
const JPM=[
 {id:'goj',g:'表',t:'50음도',d:'글자를 누르면 연상 그림과 발음'},
 {id:'write',g:'✍',t:'따라 쓰기',d:'연한 글자 위에 손가락으로 쓰고, 가리고 다시 쓰기'},
 {id:'kcard',g:'か',t:'글자 카드',d:'보고 소리 내 읽기 → 뒤집어 확인 → 알아요 / 헷갈려요'},
 {id:'wcard',g:'語',t:'단어 카드',d:'단어를 읽어 보고 뜻·발음 확인, 써 보기'},
 {id:'jweak',g:'!',t:'내 약점',d:'헷갈린 글자와 단어만 모아 보기'}];
const ENM=[
 {id:'speak',g:'💬',t:'오늘의 복습',d:'한국어를 보고 영어로 말하고, 써 보고, 정답 듣고 따라 하기'},
 {id:'mine',g:'★',t:'내 표현',d:'꼭 내 것으로 만들 표현 모음 — 별표 + 직접 추가'},
 {id:'fix',g:'✎',t:'내 실수 고치기',d:'자주 틀린 문장을 직접 고쳐 쓰기'},
 {id:'dict',g:'♪',t:'듣고 쓰기',d:'문장을 듣고 받아 써서 리스닝 확인'},
 {id:'browse',g:'≡',t:'표현 찾아보기',d:'회차별 표현 목록, 듣기, 별표 달기'}];
const enId=x=>'en|'+x.e,jpId=x=>'jp|'+x.k,kaId=x=>'ka|'+x.k,fxId=x=>'x|'+x.r,dcId=x=>'d|'+x.e;
const allEN=()=>EN.concat(S.mine.map(x=>({...x,s:'내 표현',own:1})));
const mineList=()=>allEN().filter(x=>x.own||S.star[x.e]);
function counts(){
  if(S.lang==='jp')return {kcard:deck(learnedKana(),kaId,12).length,wcard:deck(JP,jpId,12).length};
  return {speak:deck(allEN(),enId,10).length,fix:deck(ENX,fxId,10).length,dict:deck(allEN().filter(x=>!/ \/ /.test(x.e)),dcId,10).length,mine:mineList().length}}
function home(){
  document.body.classList.toggle('en',S.lang==='en');
  $('L-jp').classList.toggle('on',S.lang==='jp');$('L-en').classList.toggle('on',S.lang==='en');
  $('home').classList.remove('hide');$('play').classList.add('hide');$('foot').classList.remove('hide');
  if(!LOADED){$('sub').textContent=LOADERR||'노트 불러오는 중…';$('home').innerHTML='';return}
  const c=counts();
  $('sub').textContent=S.lang==='jp'?`배운 글자 ${learnedKana().length}자 · 단어 ${JP.length}개`:`표현 ${EN.length}개 · 내 표현 ${c.mine}개`;
  const M=S.lang==='jp'?JPM:ENM;
  $('home').innerHTML=`<div class="menu">${M.map(m=>{const n=c[m.id];return `<button class="mi" data-m="${m.id}"><i>${m.g}</i><div><b>${m.t}</b><span>${m.d}</span></div>${n?`<em>${m.id==='mine'?n+'개':'오늘 '+n+'장'}</em>`:''}</button>`}).join('')}</div>`;
}

/* ---------- 화면 공통 ---------- */
let G=null;
function open(html){$('home').classList.add('hide');$('foot').classList.add('hide');$('play').classList.remove('hide');$('play').innerHTML=html;window.scrollTo(0,0)}
function bar(title,i,n){return `<div class="bar"><button class="x" id="quit" aria-label="닫기">✕</button>${n?`<div class="prog"><div style="width:${i/n*100}%"></div></div><span style="font-weight:800">${i+1>n?n:i+1}/${n}</span>`:`<b>${title}</b>`}</div>`}
const rateBtns=(a,b,c)=>`<div class="rate"><button class="r0" data-r="0">다시<small>${a}</small></button><button class="r1" data-r="1">헷갈려요<small>${b}</small></button><button class="r2" data-r="2">알아요<small>${c}</small></button></div>`;
function done(msg){open(bar('끝')+`<div class="card center"><div class="big">${msg||'오늘 분량 끝!'}</div><div class="hint">"다시"나 "헷갈려요"를 누른 카드는 다음에 또 나와요.</div></div><div class="row c"><button class="btn" id="home2">처음으로</button></div>`)}

/* ===== 일본어 ===== */
function gojScreen(){
  const L=new Set(KANA.map(x=>x.k));
  open(bar('50음도')+`<p class="note" style="margin:0">진한 글자는 노트에서 배운 글자예요. 글자를 누르면 그림과 발음이 나와요.</p>
  <div class="goj">${GOJ.map(r=>`<div class="rh">${r.h}행</div>`+r.cells.map(c=>c?`<button class="gc${L.has(c.k)?'':' new'}" data-k="${c.k}">${c.k}<small>${c.p}</small></button>`:'<span class="gc empty"></span>').join('')).join('')}</div>`);
  G={mode:'goj'}}
let OVI=0;
function kanaPop(i){OVI=(i+GLIST.length)%GLIST.length;const c=GLIST[OVI];let ov=$('ov');
  if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov);ov.addEventListener('click',e=>{const t=e.target;if(t===ov||t.closest('#ovx'))return ov.remove();if(t.closest('#ovp'))return kanaPop(OVI-1);if(t.closest('#ovn'))return kanaPop(OVI+1);if(t.closest('#ovs'))return say(GLIST[OVI].k,'jp');if(t.closest('#ovw')){ov.remove();writeScreen([GLIST[OVI].k])}})}
  ov.innerHTML=`<div class="ovc"><div class="kbig">${c.k}</div><div style="font-size:20px;font-weight:700">${c.p}</div><img class="pic" src="${imgOf(c.k)}" alt="${c.k} 연상 그림"><div class="row c"><button class="btn ghost sm" id="ovp">◀</button>${tts?'<button class="btn sm" id="ovs">발음</button>':''}<button class="btn sm ghost" id="ovw">써 보기</button><button class="btn ghost sm" id="ovn">▶</button></div><div class="row c" style="margin-top:8px"><button class="btn ghost sm" id="ovx">닫기</button></div></div>`;
  if(S.auto)say(c.k,'jp')}

/* 따라 쓰기 */
function writeList(){const r=S.kanaRow;if(r==='learned'){const l=learnedKana();return l.length?l.map(c=>c.k):GLIST.map(c=>c.k)}if(r==='all')return GLIST.map(c=>c.k);const row=GOJ.find(x=>x.h===r);return row?row.cells.filter(Boolean).map(c=>c.k):[]}
function writeScreen(list){
  const fixed=!!list;list=list||writeList();
  G={mode:'write',list,i:0,guide:true,fixed};drawWrite()}
function drawWrite(){
  const g=G,k=g.list[g.i],kc=GLIST.find(c=>c.k===k),info=kc?kc.p:(JP.find(x=>x.k===k)||{}).p||'';
  const rows=['learned','all',...GOJ.map(r=>r.h)];
  open(bar('따라 쓰기')+(g.fixed?'':`<div class="chips">${rows.map(r=>`<button class="chip${S.kanaRow===r?' on':''}" data-row="${r}">${r==='learned'?'배운 글자':r==='all'?'전체':r+'행'}</button>`).join('')}</div>`)+
  `<div class="card center" style="padding:14px"><div class="ask">${g.guide?'연한 글자를 따라 써 보세요':'가이드 없이 써 보세요 → 「겹쳐 보기」로 확인'}</div><div class="mid jpf">${esc(k)} <span style="font-size:16px;color:var(--mute)">${esc(info)}</span></div></div>
  <div class="pad" id="pad"><canvas id="cg"></canvas><canvas id="ci"></canvas></div>
  <div class="row c" style="margin-top:12px"><button class="btn ghost sm" id="wclr">지우기</button><button class="btn ghost sm" id="wgd">${g.guide?'가이드 숨기기':'겹쳐 보기'}</button>${tts?'<button class="btn ghost sm" id="wsay">발음</button>':''}</div>
  <div class="row c" style="margin-top:8px"><button class="btn ghost" id="wprev">◀ 이전</button><span style="font-weight:800">${g.i+1}/${g.list.length}</span><button class="btn" id="wnext">다음 ▶</button></div>`);
  setupPad(k)}
function setupPad(k){
  const pad=$('pad'),cg=$('cg'),ci=$('ci'),dpr=window.devicePixelRatio||1,W=pad.clientWidth;
  if(!cg.getContext||!cg.getContext('2d'))return;
  for(const c of [cg,ci]){c.width=W*dpr;c.height=W*dpr;c.getContext('2d').scale(dpr,dpr)}
  const g=cg.getContext('2d');if(!g)return;g.strokeStyle='rgba(128,128,128,.35)';g.setLineDash([6,6]);g.lineWidth=1;g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,W);g.moveTo(0,W/2);g.lineTo(W,W/2);g.stroke();
  if(G.guide){const n=Array.from(k).length,fs=Math.min(W*.78,W*.92/n);g.font=`500 ${fs}px "Noto Sans JP",sans-serif`;g.fillStyle='rgba(128,128,128,.28)';g.textAlign='center';g.textBaseline='middle';g.fillText(k,W/2,W/2+fs*.04)}
  const x=ci.getContext('2d');x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(6,W*.035);const th=document.documentElement.dataset.theme,dk=th?th==='dark':matchMedia('(prefers-color-scheme: dark)').matches;x.strokeStyle=dk?'#f3efe9':'#1a1714';
  let drawing=false;const pos=e=>{const r=ci.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  ci.addEventListener('pointerdown',e=>{drawing=true;ci.setPointerCapture(e.pointerId);const [a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()});
  ci.addEventListener('pointermove',e=>{if(!drawing)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke()});
  const up=()=>{drawing=false};ci.addEventListener('pointerup',up);ci.addEventListener('pointercancel',up);
  G.ink=ci}

/* 글자·단어 카드 */
function cardScreen(kind,items){
  const idf=kind==='k'?kaId:jpId;
  items=items||deck(kind==='k'?learnedKana():JP,idf,12);
  if(!items.length)return done('지금 복습할 카드가 없어요. 내일 다시 와요!');
  G={mode:'card',kind,items:shuf(items),i:0,flip:false,idf};drawCard()}
function drawCard(){
  const g=G;if(g.i>=g.items.length)return done();
  const x=g.items[g.i],isK=g.kind==='k';
  let h=bar('',g.i,g.items.length)+`<div class="card center"><div class="ask">${g.flip?'맞게 읽었나요?':'소리 내서 읽어 보세요'}</div><div class="big jpf" style="font-size:${isK?'84px':'44px'}">${esc(x.k)}</div>`;
  if(g.flip){h+=`<div class="mid">${esc(x.p)}${x.m&&!isK?` · ${esc(x.m)}`:''}</div>${isK?`<img class="pic" src="${imgOf(x.k)}" alt="">`:''}</div><div class="row c">${tts?'<button class="btn ghost sm" id="csay">다시 듣기</button>':''}<button class="btn ghost sm" id="cwrite">써 보기</button></div>`+rateBtns('곧 다시','내일','며칠 뒤');if(S.auto)say(x.k,'jp')}
  else h+=`</div><button class="btn" id="cflip" style="width:100%">뒤집기</button>`;
  open(h)}

/* 내 약점 */
function weakScreen(){
  const wk=[...learnedKana().map(c=>({...c,kind:'k'})),...JP.map(x=>({...x,kind:'w'}))].filter(x=>{const c=S.srs[(x.kind==='k'?kaId:jpId)(x)];return c&&(c.w||0)>0}).sort((a,b)=>(S.srs[(b.kind==='k'?kaId:jpId)(b)].w)-(S.srs[(a.kind==='k'?kaId:jpId)(a)].w));
  G={mode:'weak',wk};
  open(bar('내 약점')+`<div class="row"><button class="btn" id="wkgo"${wk.length?'':' disabled'}>약점만 카드로 복습</button></div>
  <h3 style="margin:18px 0 4px">카드에서 헷갈렸던 것</h3>${wk.length?`<ul class="list">${wk.map(x=>`<li><div><b class="jpf">${esc(x.k)}</b><small>${esc(x.p)}${x.m&&x.kind==='w'?' · '+esc(x.m):''} · ${S.srs[(x.kind==='k'?kaId:jpId)(x)].w}번</small></div>${tts?`<button class="ib" data-say="${esc(x.k)}">🔊</button>`:''}</li>`).join('')}</ul>`:'<p class="note">아직 없어요. 카드에서 「다시」나 「헷갈려요」를 누르면 여기 모여요.</p>'}
  <h3 style="margin:18px 0 4px">노트의 헷갈리는 글자 · 내 약점</h3><ul class="list">${JTRAP.map(x=>`<li><div><b class="jpf">${esc(x.k)} <span style="font-weight:500">${esc(x.p)}</span></b><small>✗ ${esc(x.t)} — ${esc(x.h)}</small></div>${tts?`<button class="ib" data-say="${esc(x.k)}">🔊</button>`:''}</li>`).join('')}</ul>`)}

/* ===== 영어 ===== */
function speakScreen(items,title){
  items=items||deck(mineList().concat(allEN().filter(x=>!x.own&&!S.star[x.e]).reverse()),enId,10);
  if(!items.length)return done('지금 복습할 표현이 없어요. 내일 다시 와요!');
  G={mode:'speak',items,i:0,stage:'q',said:'',title};drawSpeak()}
function drawSpeak(){
  const g=G;if(g.i>=g.items.length)return done();
  const x=g.items[g.i],st=S.star[x.e]||x.own;
  let h=bar('',g.i,g.items.length)+`<div class="card"><button class="star${st?' on':''}" id="star" aria-label="내 표현">${st?'★':'☆'}</button><div class="ask">${esc(x.s)}${x.sit?' · '+esc(x.sit):''}</div><div class="mid" style="padding-right:40px">${esc(x.m)}</div><div class="hint">영어로 소리 내서 말해 보고, 직접 써 보세요</div></div>`;
  if(g.stage==='q'){
    h+=`<textarea id="ta" placeholder="영어로 써 보세요" autocapitalize="off" autocomplete="off" spellcheck="false">${esc(g.said)}</textarea>
    <div class="row" style="margin-top:10px">${SR?'<button class="btn ghost" id="mic">🎤 말하고 확인</button>':''}<button class="btn" id="chk">확인</button><button class="btn ghost" id="show">정답 보기</button></div><div id="micmsg" class="note"></div>`}
  else{
    const b=g.said?compare(x.e,g.said):null;
    h+=`<div class="ans">${g.said?verdictHTML(b)+`<div class="k">내 답: ${esc(g.said)}</div>`:''}<div class="t" style="margin-top:6px">${b?b.html:esc(x.e)}</div><div class="row" style="margin-top:10px">${tts?'<button class="btn ghost sm" id="esay">듣기</button><button class="btn ghost sm" id="eslow">천천히</button>':''}</div><div class="k">정답을 듣고 2~3번 소리 내서 따라 해 보세요.</div></div>`+rateBtns('곧 다시','내일','며칠 뒤');
    if(S.auto)say(x.e,'en')}
  open(h);const ta=$('ta');if(ta)ta.addEventListener('input',()=>{g.said=ta.value})}
function fixScreen(){const items=deck(ENX,fxId,10);if(!items.length)return done('지금 고칠 문장이 없어요.');G={mode:'fix',items,i:0,stage:'q',said:''};drawFix()}
function drawFix(){
  const g=G;if(g.i>=g.items.length)return done();const x=g.items[g.i];
  let h=bar('',g.i,g.items.length)+`<div class="card"><div class="ask">틀린 문장을 바르게 고쳐 써 보세요${x.k?' · '+esc(x.k):''}</div><div class="mid bad-t" style="text-decoration:line-through;text-decoration-thickness:1px">${esc(x.w)}</div></div>`;
  if(g.stage==='q')h+=`<textarea id="ta" placeholder="고친 문장" autocapitalize="off" autocomplete="off" spellcheck="false">${esc(g.said||x.w)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="chk">확인</button><button class="btn ghost" id="show">정답 보기</button></div>`;
  else{const b=g.said?compare(x.r,g.said):null;h+=`<div class="ans">${b?verdictHTML(b):''}<div class="t">${b?b.html:esc(x.r)}</div><div class="k">규칙: ${esc(x.m)}</div>${tts?'<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="esay">듣기</button></div>':''}</div>`+rateBtns('곧 다시','내일','며칠 뒤');if(S.auto)say(x.r,'en')}
  open(h);const ta=$('ta');if(ta)ta.addEventListener('input',()=>{g.said=ta.value})}
function dictScreen(){const items=deck(allEN().filter(x=>!/ \/ /.test(x.e)),dcId,10);if(!items.length)return done('지금 받아쓸 문장이 없어요.');G={mode:'dict',items,i:0,stage:'q',said:''};drawDict();setTimeout(()=>say(G.items[0].e,'en'),300)}
function drawDict(){
  const g=G;if(g.i>=g.items.length)return done();const x=g.items[g.i];
  let h=bar('',g.i,g.items.length)+`<div class="card center"><div class="ask">잘 듣고 받아 써 보세요</div><div class="row c" style="margin-top:10px"><button class="btn" id="esay">▶ 듣기</button><button class="btn ghost" id="eslow">천천히</button></div></div>`;
  if(g.stage==='q')h+=`<textarea id="ta" placeholder="들은 문장" autocapitalize="off" autocomplete="off" spellcheck="false">${esc(g.said)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="chk">확인</button><button class="btn ghost" id="show">정답 보기</button></div>`;
  else{const b=g.said?compare(x.e,g.said):null;h+=`<div class="ans">${b?verdictHTML(b):''}<div class="t">${b?b.html:esc(x.e)}</div><div class="k">${esc(x.m)}</div></div>`+rateBtns('곧 다시','내일','며칠 뒤')}
  open(h);const ta=$('ta');if(ta)ta.addEventListener('input',()=>{g.said=ta.value})}
function mineScreen(msg){
  const L=mineList();G={mode:'mine'};
  open(bar('내 표현')+`<div class="row"><button class="btn" id="mgo"${L.length?'':' disabled'}>내 표현만 복습</button></div>
  <h3 style="margin:18px 0 6px">새로 알게 된 표현 추가</h3>
  <input type="text" id="ne" placeholder="영어 표현 (예: Could you keep my bags?)" autocapitalize="off" spellcheck="false" style="margin-bottom:8px"><input type="text" id="nm" placeholder="뜻 (예: 짐 좀 맡아 주실래요?)">
  <div class="row" style="margin-top:8px"><button class="btn" id="nadd">추가</button><span class="note" style="margin:0">${esc(msg||'')}</span></div>
  <h3 style="margin:18px 0 4px">모음 ${L.length}개</h3>${L.length?`<ul class="list">${L.map(x=>{const c=S.srs[enId(x)];return `<li><div><b>${esc(x.e)}</b><small>${esc(x.m)} · ${x.own?'직접 추가':esc(x.s)}${c?` · ${c.b}단계`:''}</small></div>${tts?`<button class="ib" data-sayen="${esc(x.e)}">🔊</button>`:''}${x.own?`<button class="ib" data-del="${esc(x.e)}" aria-label="삭제">🗑</button>`:`<button class="ib on" data-star="${esc(x.e)}" aria-label="별표 해제">★</button>`}</li>`}).join('')}</ul>`:'<p class="note">연습 카드나 「표현 찾아보기」에서 ☆를 누르면 여기 모여요.</p>'}`)}
function browseScreen(ses){
  const sess=[...new Set(EN.map(x=>x.s))];ses=ses||sess[sess.length-1];G={mode:'browse',ses};
  const L=EN.filter(x=>x.s===ses);
  open(bar('표현 찾아보기')+`<div class="chips">${sess.map(s=>`<button class="chip${s===ses?' on':''}" data-ses="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <div class="row"><button class="btn" id="bgo">이 회차 말하기 연습</button></div>
  <ul class="list">${L.map(x=>`<li><div><b>${esc(x.e)}</b><small>${x.sit?esc(x.sit)+' · ':''}${esc(x.m)}</small></div>${tts?`<button class="ib" data-sayen="${esc(x.e)}">🔊</button>`:''}<button class="ib${S.star[x.e]?' on':''}" data-star="${esc(x.e)}" aria-label="내 표현">${S.star[x.e]?'★':'☆'}</button></li>`).join('')}</ul>`)}

/* ---------- 이벤트 ---------- */
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;S.lang=b.dataset.l;save();home()});
$('home').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;({goj:gojScreen,write:()=>writeScreen(),kcard:()=>cardScreen('k'),wcard:()=>cardScreen('w'),jweak:weakScreen,speak:()=>speakScreen(),mine:()=>mineScreen(),fix:fixScreen,dict:dictScreen,browse:()=>browseScreen()})[b.dataset.m]()});
function next(){G.i++;G.stage='q';G.said='';G.flip=false;({card:drawCard,speak:drawSpeak,fix:drawFix,dict:drawDict})[G.mode]();if(G.mode==='dict'&&G.i<G.items.length)setTimeout(()=>say(G.items[G.i].e,'en'),300)}
$('play').addEventListener('click',e=>{
  const t=e.target,q=s=>t.closest(s);
  if(q('#quit')||q('#home2'))return home();
  const sy=q('[data-say]');if(sy)return say(sy.dataset.say,'jp');
  const se=q('[data-sayen]');if(se)return say(se.dataset.sayen,'en');
  const stb=q('[data-star]');if(stb){const k=stb.dataset.star;if(S.star[k])delete S.star[k];else S.star[k]=1;save();return G.mode==='mine'?mineScreen():browseScreen(G.ses)}
  const dl=q('[data-del]');if(dl){S.mine=S.mine.filter(x=>x.e!==dl.dataset.del);save();return mineScreen('지웠어요.')}
  const rb=q('[data-r]');if(rb){const x=G.items[G.i];const id=G.mode==='card'?G.idf(x):G.mode==='speak'?enId(x):G.mode==='fix'?fxId(x):dcId(x);rate(id,+rb.dataset.r);if(rb.dataset.r==='0'&&!x._again){G.items.push({...x,_again:1})}return next()}
  switch(G&&G.mode){
    case 'goj':{const b=q('.gc[data-k]');if(b)kanaPop(GLIST.findIndex(c=>c.k===b.dataset.k));return}
    case 'write':{const r=q('[data-row]');if(r){S.kanaRow=r.dataset.row;save();return writeScreen()}
      if(q('#wclr')){const c=G.ink;c.getContext('2d').clearRect(0,0,c.width,c.height);return}
      if(q('#wgd')){G.guide=!G.guide;if(!G.ink)return drawWrite();const img=G.ink.toDataURL();drawWrite();const im=new Image();im.onload=()=>{const c=G.ink,d=window.devicePixelRatio||1;c.getContext('2d').drawImage(im,0,0,c.width/d,c.height/d)};im.src=img;return}
      if(q('#wsay'))return say(G.list[G.i],'jp');
      if(q('#wprev')){G.i=(G.i-1+G.list.length)%G.list.length;G.guide=true;return drawWrite()}
      if(q('#wnext')){G.i=(G.i+1)%G.list.length;G.guide=true;return drawWrite()}return}
    case 'card':{if(q('#cflip')){G.flip=true;return drawCard()}if(q('#csay'))return say(G.items[G.i].k,'jp');if(q('#cwrite'))return writeScreen([G.items[G.i].k]);return}
    case 'weak':{if(q('#wkgo')){const ks=G.wk.filter(x=>x.kind==='k'),ws=G.wk.filter(x=>x.kind==='w');return ws.length?cardScreen('w',ws):cardScreen('k',ks)}return}
    case 'speak':case 'fix':case 'dict':{const x=G.items[G.i];
      if(q('#star')){if(x.own)return;if(S.star[x.e])delete S.star[x.e];else S.star[x.e]=1;save();return drawSpeak()}
      if(q('#chk')){G.said=($('ta')||{}).value||'';if(!G.said.trim())return;G.stage='a';return({speak:drawSpeak,fix:drawFix,dict:drawDict})[G.mode]()}
      if(q('#show')){G.said='';G.stage='a';return({speak:drawSpeak,fix:drawFix,dict:drawDict})[G.mode]()}
      if(q('#esay'))return say(G.mode==='fix'?x.r:x.e,'en');
      if(q('#eslow'))return say(G.mode==='fix'?x.r:x.e,'en',.6);
      if(q('#mic')){const m=$('micmsg');m.textContent='듣고 있어요… 영어로 말해 보세요';listen(tx=>{G.said=tx;G.stage='a';drawSpeak()},err=>{m.textContent=err==='not-allowed'?'마이크 권한을 허용해 주세요.':'잘 안 들렸어요. 다시 눌러 보거나 써서 확인해 보세요.'});return}
      return}
    case 'mine':{if(q('#mgo'))return speakScreen(shuf(mineList()).slice(0,15));
      if(q('#nadd')){const e2=$('ne').value.trim(),m2=$('nm').value.trim();if(!e2||!m2)return mineScreen('영어와 뜻을 둘 다 적어 주세요.');if(allEN().some(x=>x.e===e2))return mineScreen('이미 있는 표현이에요.');S.mine.push({e:e2,m:m2});save();return mineScreen('추가했어요. 오늘의 복습에 먼저 나와요.')}return}
    case 'browse':{const s=q('[data-ses]');if(s)return browseScreen(s.dataset.ses);if(q('#bgo'))return speakScreen(EN.filter(x=>x.s===G.ses));return}
  }
});
document.addEventListener('keydown',e=>{if($('ov')){if(e.key==='ArrowLeft')kanaPop(OVI-1);if(e.key==='ArrowRight')kanaPop(OVI+1);if(e.key==='Escape')$('ov').remove()}});
if(tts)try{speechSynthesis.getVoices()}catch(e){}
home();loadNotes();
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js')}catch(e){}
}
